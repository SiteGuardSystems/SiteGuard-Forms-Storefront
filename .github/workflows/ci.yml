name: CI
on:
  pull_request:
  push:
    branches: [master, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and unit tests (banned words, links, prices, page size, DCR gate)
        run: npm test
      # T07 (DCR single-truth brief 2.7): the public page-A DCR extract pinned in
      # dcr.lock (vendored, no network or secrets) against data/, content/ and the
      # site's code. Fails on a hash mismatch; a code that doesn't resolve (unknown,
      # reserved, page B or internal); a retired code shown or sold; a title that
      # differs from the DCR; a catalogue stamped with another revision or not
      # stamped; and a generated catalogue.json edited by hand. Exceptions:
      # dcr.allowlist.json, each with a reason.
      - name: dcr-check
        run: |
          rc=0
          npm run --silent dcr-check > dcr-check.txt || rc=$?
          cat dcr-check.txt
          { echo '### dcr-check'; echo '```'; cat dcr-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Browser end-to-end
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
