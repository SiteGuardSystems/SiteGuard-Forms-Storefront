<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redeem a Project — SiteGuard FORMS</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a class="lockup" href="/" aria-label="SiteGuard FORMS — Home">
      <img class="lockup-img" src="/logo.png" alt="SiteGuard shield" width="34" height="38" />
      <span class="lockup-wm">S<span class="oi">i</span>teGuard</span>
      <span class="forms-tag">FORMS</span>
    </a>
  </div>
</header>

<main>
  <section class="packages">
    <div class="wrap" style="max-width: 560px; text-align: left;">
      <p class="eyebrow">Redeem a project credit</p>
      <h1 style="font-size: 2rem;">Set Up Your Next Project</h1>
      <p class="section-sub" style="margin: 0 0 1.5rem;">
        Enter the project's details and we'll prepare your controlled documents
        for this specific site and client.
      </p>

      <div id="redeem-loading" class="loading">Checking your link…</div>
      <div id="redeem-error" class="form-status error" hidden></div>

      <form id="redeem-form" class="lead-form" hidden>
        <label>Package
          <select name="packageId" id="redeem-package" required></select>
        </label>
        <p class="package-status" id="redeem-balance"></p>
        <label>Project Address<input required name="projectAddress" type="text" placeholder="123 Example St, Melbourne VIC" /></label>
        <label>Client / Company Name<input required name="clientName" type="text" /></label>
        <label>Site Notes (optional)
          <textarea name="siteNotes" rows="3" placeholder="Anything specific to this site — scope, hazards, access notes"></textarea>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Submit Project</button>
        <p class="form-status" id="redeem-status" role="status"></p>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-row">
    <p class="lockup footer-lockup">
      <img class="lockup-img" src="/logo.png" alt="SiteGuard shield" width="28" height="31" />
      <span class="lockup-wm">S<span class="oi">i</span>teGuard</span>
      <span class="forms-tag">FORMS</span>
    </p>
    <p class="copyright">© 2026 SiteGuard Systems. Melbourne, Victoria. All rights reserved.</p>
  </div>
</footer>

<script src="/redeem.js"></script>
</body>
</html>
